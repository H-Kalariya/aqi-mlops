# Owner: M3 — CI/CD: Continuous Integration workflow
name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  lint:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pre-commit

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Code Formatter Check
        run: black --check .

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: pytest -v tests/

  pipeline-check:
    name: End-to-End Synthetic Pipeline Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest synthetic dataset
        run: python -m src.ingest.run --source synthetic --days 30

      - name: Validate dataset
        run: python -m src.validate.run

      - name: Generate feature matrices
        run: python -m src.features.run

      - name: Train LightGBM model
        run: python -m src.train.run --fast

      - name: Evaluate model
        run: python -m src.evaluate.run

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: pipeline-check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aqi-api:ci-test
