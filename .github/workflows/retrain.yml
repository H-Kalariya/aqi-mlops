# Owner: M3 — Continuous Training: Automated Retraining & Promotion Workflow
name: Retrain Pipeline

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Reason for retraining'
        required: false
        default: 'Manual trigger or drift alert'

jobs:
  retrain:
    name: Retrain, Evaluate, and Promote
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Pipeline (Ingest, Validate, Features)
        run: |
          python -m src.ingest.run --source synthetic --days 90
          python -m src.validate.run
          python -m src.features.run

      - name: Train Challenger Model
        run: python -m src.train.run --fast

      - name: Evaluate Model
        run: python -m src.evaluate.run

      - name: Champion vs Challenger Promotion Decision
        run: python -m src.drift.promote

      - name: Upload Promotion Decision Artifact
        uses: actions/upload-artifact@v4
        with:
          name: promotion-decision
          path: reports/promotion_decision.json
