# Owner: Shared (M1 as repo/release manager) — Core configuration
# AQI Forecaster MLOps — Central Configuration

project:
  name: aqi-forecaster
  version: "1.0.0"

cities:
  - ahmedabad
  - delhi
  - mumbai

# Forecast horizon (hours ahead)
horizon: 24

# Data ingestion settings
ingest:
  # Options: live | snapshot | synthetic
  source: synthetic
  # Number of months of synthetic data to generate per city
  synthetic_months: 12
  # Snapshot directory (relative to project root)
  snapshot_dir: data/snapshot
  # Rate limit (requests per minute) for live APIs
  rate_limit: 30
  # Retry settings
  max_retries: 3
  retry_backoff: 2.0

# Data paths
paths:
  raw: data/raw
  processed: data/processed
  snapshot: data/snapshot
  reports: reports
  models: models

# MLflow settings
mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI:-sqlite:///mlflow.db}
  registered_model_name: aqi-forecaster
  artifact_location: mlartifacts

# DVC remote
dvc:
  remote_name: local-remote
  remote_url: ../dvc-remote

# Validation thresholds
validation:
  pm25_range: [0, 1000]
  pm10_range: [0, 1000]
  no2_range: [0, 500]
  so2_range: [0, 200]
  co_range: [0, 50]
  o3_range: [0, 500]
  aqi_range: [0, 500]
  temperature_range: [-10, 55]
  humidity_range: [0, 100]
  wind_speed_range: [0, 50]

# Feature engineering
features:
  aqi_lags: [1, 3, 6, 12, 24]
  pm25_lags: [1, 24]
  aqi_roll_mean_windows: [6, 24]
  aqi_roll_std_windows: [24]
  train_split_ratio: 0.8

# Drift detection (Evidently)
drift:
  reference_window_days: 30
  current_window_days: 7
  share_drifted_threshold: 0.3
  p_value_threshold: 0.05

# API settings
api:
  host: 0.0.0.0
  port: 8000

# Docker / Deployment
deployment:
  registry: ghcr.io
  image_name: aqi-forecaster
  nginx_port: 8080
  canary_weight_stable: 9
  canary_weight_canary: 1
  health_check_interval: 5
  health_check_retries: 3
