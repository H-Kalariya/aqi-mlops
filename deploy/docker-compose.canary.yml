# Owner: M2 — Deployment: canary compose file
# Run with: docker compose -f deploy/docker-compose.canary.yml up -d
# Sets up api-stable and api-canary behind nginx with 9:1 weighted split

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: aqi-nginx-canary
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.canary.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-stable
      - api-canary
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-stable:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aqi-api-stable
    environment:
      - APP_VERSION=${STABLE_VERSION:-1.0.0}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aqi-api-canary
    environment:
      - APP_VERSION=${CANARY_VERSION:-1.1.0}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  aqi-network:
    name: assignment_aqi-network
    external: true
