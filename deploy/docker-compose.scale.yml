# Owner: M2 — Deployment: scaled compose override
# Run with: docker compose -f docker-compose.yml -f deploy/docker-compose.scale.yml up -d --scale api=3

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: aqi-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    # Override: remove fixed container_name to allow scaling
    container_name: ""
    ports: []  # nginx handles external traffic
