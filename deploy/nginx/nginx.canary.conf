# Owner: M2 — Deployment: nginx canary config (9:1 weight split)
# Canary release: 90% stable, 10% canary

upstream api_stable {
    server api-stable:8000 weight=9;
}

upstream api_canary {
    server api-canary:8000 weight=1;
}

# Combined upstream with weighted routing
upstream api_backend {
    server api-stable:8000 weight=9;
    server api-canary:8000 weight=1;
}

server {
    listen 8080;
    server_name localhost;

    proxy_pass_header X-App-Version;
    proxy_pass_header X-Model-Version;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        deny all;
    }
}
