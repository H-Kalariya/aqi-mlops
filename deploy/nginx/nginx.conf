# Owner: M2 — Deployment: nginx reverse proxy config
# Reverse proxy for AQI API with load balancing across replicas

upstream api_backend {
    # Docker Compose DNS resolves 'api' to all replicas
    server api:8000;

    # Keep idle upstream connections warm to reduce TCP/handshake overhead
    # under sustained load. Mirrors a K8s Service keep-alive to backing pods.
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name localhost;

    # Pass version headers from upstream
    proxy_pass_header X-App-Version;
    proxy_pass_header X-Model-Version;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for upstream keepalive connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Nginx status for monitoring
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.0.0.0/8;  # Docker network
        deny all;
    }
}
