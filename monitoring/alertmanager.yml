# Owner: M3 — Monitoring: Alertmanager configuration
# Routing alerts to notification receivers

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      repeat_interval: 1h

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:-http://localhost:5001/alerts}'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: '${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://localhost:5001/critical-alerts}'
        send_resolved: true
